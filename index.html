<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuron AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #ffffff;
            color: #202124;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        .google-search-bar {
            background: #ffffff;
            border: 1px solid #dfe1e5;
            box-shadow: 0 1px 6px rgba(32,33,36,0.1);
            border-radius: 24px;
            transition: all 0.2s ease-in-out;
        }
        .google-search-bar:hover, .google-search-bar:focus-within {
            box-shadow: 0 1px 12px rgba(32,33,36,0.2);
            border-color: rgba(223,225,229,0);
        }
        .tool-line-card {
            background: #f8f9fa;
            border-radius: 16px;
            border: 1px solid #f1f3f4;
            transition: all 0.2s ease;
        }
        .tool-line-card:hover {
            background: #f1f3f4;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-4 md:p-6 max-w-lg mx-auto">

    <!-- Top Minimal Bar -->
    <header class="flex justify-between items-center py-2">
        <div class="flex items-center space-x-2">
            <span class="text-xs bg-gray-100 text-gray-600 px-3 py-1 rounded-full font-medium">Founding Owner</span>
        </div>
        <div class="w-9 h-9 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-sm shadow-md">
            Z
        </div>
    </header>

    <!-- Center Google-Style Branding & Search Bar -->
    <main class="flex-grow flex flex-col justify-center my-auto space-y-6">
        
        <!-- Logo Header -->
        <div class="text-center space-y-1">
            <h1 class="text-4xl font-extrabold tracking-tight text-gray-900">
                <span class="text-blue-600">Z</span><span class="text-red-500">u</span><span class="text-yellow-500">r</span><span class="text-blue-600">o</span><span class="text-green-600">n</span>
                <span class="text-gray-800 text-2xl font-light">AI</span>
            </h1>
            <p class="text-xs text-gray-500">Parent Intelligence System</p>
        </div>

        <!-- Center Google Search Bar -->
        <div class="google-search-bar p-3 flex items-center space-x-3">
            <i class="fas fa-search text-gray-400 text-sm ml-2"></i>
            <input type="text" id="main-prompt" placeholder="Ask Zuron AI or open tool..." class="w-full bg-transparent text-sm text-gray-800 focus:outline-none">
            <button onclick="goToStudio()" class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center text-xs hover:bg-blue-700 transition">
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>

    </main>

    <!-- Bottom Tool Lines (गूगल स्टाइल निचली परतों में सजे टूल्स) -->
    <footer class="space-y-3 pt-6 border-t border-gray-100">
        <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider px-1">इकोसिस्टम टूल्स</p>

        <div class="space-y-2">
            <!-- Tool 1: Zuron Studio -->
            <a href="studio.html" class="tool-line-card p-3.5 flex items-center justify-between block">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-purple-100 text-purple-600 flex items-center justify-center text-xs">
                        <i class="fas fa-video"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-gray-800">Zuron Studio</h3>
                        <p class="text-[10px] text-gray-500">9:16 वर्टिकल प्रोमो व मोटूराम वॉइस</p>
                    </div>
                </div>
                <span class="text-xs text-gray-400"><i class="fas fa-angle-right"></i></span>
            </a>

            <!-- Tool 2: KARAN RESOLVE -->
            <div class="tool-line-card p-3.5 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xs">
                        <i class="fas fa-file-lines"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-gray-800">KARAN RESOLVE</h3>
                        <p class="text-[10px] text-gray-500">1-क्लिक ड्राफ्टिंग व ऑटोमेशन</p>
                    </div>
                </div>
                <span class="text-[9px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">पाइपलाइन</span>
            </div>

            <!-- Tool 3: Zuron Business -->
            <div class="tool-line-card p-3.5 flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center text-xs">
                        <i class="fas fa-shop"></i>
                    </div>
                    <div>
                        <h3 class="text-xs font-bold text-gray-800">Zuron Business</h3>
                        <p class="text-[10px] text-gray-500">लोकल बिजनेस ऑटोमेशन</p>
                    </div>
                </div>
                <span class="text-[9px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full">पाइपलाइन</span>
            </div>
        </div>
    </footer>

    <script>
        function goToStudio() {
            window.location.href = 'studio.html';
        }
    </script>
</body>
        </html>
