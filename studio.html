<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuron Studio AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col h-screen justify-between">

    <!-- Header -->
    <header class="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-lg text-purple-600">Zuron Studio AI</span>
        </div>
        <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full font-medium">Pro Studio</span>
    </header>

    <!-- Chat Container -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex items-start space-x-2">
            <div class="bg-purple-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">Z</div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border max-w-[80%] text-sm text-gray-800">
                प्रणाम भाई! नीचे दिए गए <b>+ (प्लस)</b> बटन से अपनी या अपनी दुकान की फोटो अपलोड करें, और साथ में लिखकर या बोलकर बताएं कि वीडियो कैसी बनानी है। मैं आपकी असली फोटो के आधार पर लाइव 9:16 वीडियो बना दूँगा!
            </div>
        </div>

        <!-- Image Preview Area -->
        <div id="image-preview-container" class="hidden px-10">
            <img id="image-preview" class="w-32 h-32 object-cover rounded-xl border shadow-sm" alt="Preview">
        </div>
    </div>

    <!-- Main Input Bar -->
    <div class="floating-input-container p-2 flex flex-col bg-white border-t">
        <div class="flex items-center space-x-2">
            <!-- Hidden File Input for Gallery / Camera -->
            <input type="file" id="user-image-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
            
            <!-- Plus Button to Upload Image -->
            <button onclick="document.getElementById('user-image-input').click()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-purple-600 transition" title="फोटो चुनें">
                <i class="fas fa-plus text-sm"></i>
            </button>

            <!-- Voice Input Button -->
            <button onclick="startVoiceRecognition()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-purple-600 transition" title="बोलकर टाइप करें">
                <i class="fas fa-microphone text-sm"></i>
            </button>

            <!-- Text Prompt Input -->
            <input type="text" id="user-prompt" placeholder="यहाँ प्रॉम्प्ट लिखें या बोलें..." class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">

            <!-- Send Button -->
            <button onclick="processUserMessage()" class="w-10 h-10 rounded-full bg-purple-600 hover:bg-purple-700 flex items-center justify-center text-white transition shadow-md">
                <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </div>
    </div>

    <script>
        let selectedImageData = null;

        // Handle Image Selection & Open Gallery directly
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageData = e.target.result;
                    document.getElementById('image-preview').src = selectedImageData;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        // Voice Recognition
        function startVoiceRecognition() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'hi-IN';
            recognition.onresult = function(event) {
                document.getElementById('user-prompt').value = event.results[0][0].transcript;
            };
            recognition.start();
        }

        // Process and Send to Backend
        async function processUserMessage() {
            const promptText = document.getElementById('user-prompt').value;
            if (!promptText && !selectedImageData) {
                alert('कृपया कुछ लिखें या फोटो चुनें!');
                return;
            }

            alert('वीडियो प्रोसेसिंग शुरू हो रही है...');
            
            try {
                const response = await fetch('https://zuron-ai.onrender.com/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText, image: selectedImageData })
                });
                const data = await response.json();
                console.log(data);
                alert('सफलतापूर्वक कनेक्ट हो गया!');
            } catch (error) {
                console.error(error);
                alert('कनेक्शन में दिक्कत आई है!');
            }
        }
    </script>
</body>
    </html>
