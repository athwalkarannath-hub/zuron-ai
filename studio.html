<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuron AI Studio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 20px;
        }
        input, button {
            padding: 12px;
            margin: 10px;
            width: 85%;
            max-width: 400px;
            border-radius: 8px;
            border: none;
            font-size: 16px;
        }
        input {
            background-color: #1e1e1e;
            color: #ffffff;
            border: 1px solid #333;
        }
        button {
            background-color: #6200ee;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #3700b3;
        }
        video {
            margin-top: 20px;
            max-width: 90%;
            border-radius: 10px;
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
            color: #03dac6;
        }
    </style>
</head>
<body>

    <h1>Zuron AI Studio</h1>
    <p>अपने फोन के सर्वर से सीधे वीडियो जनरेट करें</p>

    <div>
        <input type="text" id="promptInput" placeholder="वीडियो का प्रॉम्प्ट यहाँ लिखें...">
        <br>
        <input type="text" id="imageInput" placeholder="इमेज URL (वैकल्पिक)">
        <br>
        <button onclick="generateVideo()">वीडियो जनरेट करें</button>
    </div>

    <h3 id="status"></h3>
    <video id="videoOutput" controls style="display:none;"></video>

    <script>
        // आपका लाइव क्लाउडफ्लेयर टनल लिंक
        const BACKEND_URL = "https://miss-green-necessary-symposium.trycloudflare.com";

        async function generateVideo() {
            const prompt = document.getElementById('promptInput').value;
            const image = document.getElementById('imageInput').value;
            const status = document.getElementById('status');
            const videoOutput = document.getElementById('videoOutput');

            status.innerText = "वीडियो तैयार हो रहा है, कृपया प्रतीक्षा करें...";
            videoOutput.style.display = 'none';

            try {
                const response = await fetch(`${BACKEND_URL}/generate`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt, image })
                });

                const data = await response.json();
                
                if (response.ok) {
                    status.innerText = data.message || "सफलतापूर्वक तैयार हो गया!";
                    if (data.video_url) {
                        videoOutput.src = data.video_url;
                        videoOutput.style.display = 'block';
                        videoOutput.play();
                    }
                } else {
                    status.innerText = "एरर: " + (data.detail || "कुछ गलत हो गया");
                }
            } catch (error) {
                status.innerText = "सर्वर से कनेक्ट करने में विफल: " + error.message;
            }
        }
    </script>

</body>
</html>
