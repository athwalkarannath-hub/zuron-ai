<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuron AI Studio</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .studio-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 500px;
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #94a3b8;
        }
        input[type="text"], input[type="file"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        #statusLoading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #facc15;
            font-weight: 500;
        }
        #videoPlayerContainer {
            display: none;
            margin-top: 20px;
        }
        video {
            width: 100%;
            border-radius: 10px;
            border: 1px solid #38bdf8;
        }
    </style>
</head>
<body>

<div class="studio-card">
    <h2>Zuron AI Studio</h2>
    
    <div class="form-group">
        <label for="promptInput">प्रॉम्प्ट लिखें (Prompt):</label>
        <input type="text" id="promptInput" placeholder="उदा: Cyberpunk city sunset scene 9:16...">
    </div>

    <div class="form-group">
        <label for="imageInput">तस्वीर अपलोड करें (Optional Image):</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <button onclick="generateVideo()">एआई वीडियो जनरेट करें</button>

    <div id="statusLoading">⏳ सर्वर वीडियो प्रोसेस कर रहा है, कृपया इंतज़ार करें...</div>

    <div id="videoPlayerContainer">
        <label>आपकी एआई वीडियो:</label>
        <video id="videoPlayer" controls autoplay loop>
            आपका ब्राउज़र वीडियो टैग को सपोर्ट नहीं करता।
        </video>
    </div>
</div>

<script>
async function generateVideo() {
    const prompt = document.getElementById('promptInput').value;
    const imageFile = document.getElementById('imageInput').files[0];
    const statusLoading = document.getElementById('statusLoading');
    const videoPlayerContainer = document.getElementById('videoPlayerContainer');
    const videoPlayer = document.getElementById('videoPlayer');

    if (!prompt && !imageFile) {
        alert("कृपया कोई प्रॉम्प्ट या फोटो अपलोड करें!");
        return;
    }

    const formData = new FormData();
    if (prompt) formData.append("prompt", prompt);
    if (imageFile) formData.append("image", imageFile);

    statusLoading.style.display = "block";
    videoPlayerContainer.style.display = "none";

    try {
        // तुम्हारा नया क्लाउडफ्लेयर टनल लिंक यहाँ सेट है
        const SERVER_URL = 'https://91daf965-bb93-49bc-a242-201925347206.trycloudflare.com';
        
        const response = await fetch(`${SERVER_URL}/generate`, {
            method: 'POST',
            body: formData
        });

        const data = await response.json();

        if (response.ok) {
            videoPlayer.src = data.video_url;
            videoPlayerContainer.style.display = "block";
        } else {
            alert("सर्वर एरर: " + (data.detail || "वीडियो जनरेट नहीं हो सका"));
        }
    } catch (error) {
        console.error("Connection Error:", error);
        alert("बैकएंड सर्वर से कनेक्शन नहीं हो पा रहा है! कृपया चेक करें कि Termux में सर्वर और टनल चालू है या नहीं।");
    } finally {
        statusLoading.style.display = "none";
    }
}
</script>

</body>
</html>
