<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuron Studio AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex flex-col h-screen justify-between">

    <!-- Header -->
    <header class="bg-white border-b px-4 py-3 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-2">
            <span class="font-bold text-lg text-purple-600">Zuron Studio AI</span>
        </div>
        <span class="text-xs bg-purple-100 text-purple-700 px-2 py-1 rounded-full font-medium">Local Server Pro</span>
    </header>

    <!-- Chat Container -->
    <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <div class="flex items-start space-x-2">
            <div class="bg-purple-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">Z</div>
            <div class="bg-white p-3 rounded-2xl shadow-sm border max-w-[80%] text-sm text-gray-800">
                प्रणाम भाई! नीचे दिए गए <b>+ (प्लस)</b> बटन से अपनी फोटो चुनें और साथ में कमांड लिखकर भेजें। आपका लोकल सर्वर वीडियो तैयार करेगा।
            </div>
        </div>
    </div>

    <!-- Main Input Bar with Attached Image Preview -->
    <div class="p-3 bg-white border-t flex flex-col space-y-2 shadow-lg">
        
        <!-- Attached Image Preview Chip -->
        <div id="image-preview-container" class="hidden flex items-center space-x-2 px-2">
            <div class="relative inline-block">
                <img id="image-preview" class="w-14 h-14 object-cover rounded-xl border shadow-sm" alt="Preview">
                <button onclick="removeSelectedImage()" class="absolute -top-2 -right-2 bg-gray-800 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs shadow-md hover:bg-red-600 transition">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <span class="text-xs text-gray-500 font-medium">फोटो जुड़ गई है, अब कमांड लिखें...</span>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Hidden File Input for Gallery / Camera -->
            <input type="file" id="user-image-input" accept="image/*" class="hidden" onchange="handleImageSelect(event)">
            
            <!-- Plus Button to Upload Image -->
            <button onclick="document.getElementById('user-image-input').click()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-purple-600 transition" title="फोटो चुनें">
                <i class="fas fa-plus text-sm"></i>
            </button>

            <!-- Voice Input Button -->
            <button onclick="startVoiceRecognition()" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-purple-600 transition" title="बोलकर टाइप करें">
                <i class="fas fa-microphone text-sm"></i>
            </button>

            <!-- Text Prompt Input -->
            <input type="text" id="user-prompt" placeholder="यहाँ कमांड / प्रॉम्प्ट लिखें..." class="flex-1 bg-gray-100 rounded-full px-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">

            <!-- Send Button -->
            <button onclick="processUserMessage()" class="w-10 h-10 rounded-full bg-purple-600 hover:bg-purple-700 flex items-center justify-center text-white transition shadow-md">
                <i class="fas fa-paper-plane text-sm"></i>
            </button>
        </div>
    </div>

    <script>
        let selectedImageData = null;

        // Handle Image Selection
        function handleImageSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    selectedImageData = e.target.result;
                    document.getElementById('image-preview').src = selectedImageData;
                    document.getElementById('image-preview-container').classList.remove('hidden');
                };
                reader.readAsDataURL(file);
            }
        }

        // Remove Selected Image
        function removeSelectedImage() {
            selectedImageData = null;
            document.getElementById('image-preview-container').classList.add('hidden');
            document.getElementById('user-image-input').value = '';
        }

        // Voice Recognition
        function startVoiceRecognition() {
            const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
            recognition.lang = 'hi-IN';
            recognition.onresult = function(event) {
                document.getElementById('user-prompt').value = event.results[0][0].transcript;
            };
            recognition.start();
        }

        // Process and Send to Backend & Show Video
        async function processUserMessage() {
            const promptText = document.getElementById('user-prompt').value;
            if (!promptText && !selectedImageData) {
                alert('कृपया कमांड लिखें या फोटो चुनें!');
                return;
            }

            const chatContainer = document.querySelector('.flex-1.overflow-y-auto');

            // 1. चैट में यूजर का मैसेज जोड़ें
            let userMsgHTML = `<div class="flex justify-end space-x-2 my-2">
                <div class="bg-purple-100 p-3 rounded-2xl shadow-sm border max-w-[80%] text-sm text-gray-800 space-y-2">`;
            
            if (selectedImageData) {
                userMsgHTML += `<img src="${selectedImageData}" class="w-32 h-32 object-cover rounded-xl">`;
            }
            if (promptText) {
                userMsgHTML += `<p>${promptText}</p>`;
            }
            userMsgHTML += `</div></div>`;

            chatContainer.insertAdjacentHTML('beforeend', userMsgHTML);

            // इनपुट और प्रीव्यू साफ करें
            document.getElementById('user-prompt').value = '';
            removeSelectedImage();
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 2. लोडिंग मैसेज दिखाएं
            let loadingId = 'loading-' + Date.now();
            let loadingHTML = `<div id="${loadingId}" class="flex items-start space-x-2 my-2">
                <div class="bg-purple-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">Z</div>
                <div class="bg-white p-3 rounded-2xl shadow-sm border max-w-[80%] text-sm text-gray-800">
                    लोकल सर्वर पर वीडियो प्रोसेस हो रही है, कृपया इंतज़ार करें...
                </div>
            </div>`;
            chatContainer.insertAdjacentHTML('beforeend', loadingHTML);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // 3. बैकएंड को डेटा भेजें (नवीनतम टनल लिंक के साथ)
            try {
                const response = await fetch('https://posters-prostate-deals-certified.trycloudflare.com/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptText, image: selectedImageData })
                });
                
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                let aiMsgHTML = `<div class="flex items-start space-x-2 my-2">
                    <div class="bg-purple-600 text-white w-8 h-8 rounded-full flex items-center justify-center font-bold text-sm">Z</div>
                    <div class="bg-white p-3 rounded-2xl shadow-sm border max-w-[80%] text-sm text-gray-800 space-y-2">
                        <p>${data.message || 'सफलतापूर्वक तैयार हो गया है!'}</p>`;
                
                if (data.video_list && data.video_list.length > 0) {
                    data.video_list.forEach((vidUrl, index) => {
                        aiMsgHTML += `<p class="text-xs font-bold text-purple-600 mt-2">पार्ट ${index + 1}:</p>`;
                        aiMsgHTML += `<video src="${vidUrl}" controls loop class="w-full rounded-xl shadow-md"></video>`;
                    });
                } else if (data.video_url) {
                    aiMsgHTML += `<video src="${data.video_url}" controls autoplay loop class="w-full rounded-xl mt-2 shadow-md"></video>`;
                }

                aiMsgHTML += `</div></div>`;
                chatContainer.insertAdjacentHTML('beforeend', aiMsgHTML);
                chatContainer.scrollTop = chatContainer.scrollHeight;

            } catch (error) {
                console.error(error);
                document.getElementById(loadingId).remove();
                alert('सर्वर से कनेक्ट होने में दिक्कत आ रही है। जांच लें कि Termux और टनल चालू है या नहीं!');
            }
        }
    </script>
</body>
</html>
