<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zuron Studio AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            color: #1f1f1f;
            font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        }
        .chat-bubble-user {
            background: #e8f0fe;
            color: #1a73e8;
            border-radius: 20px 20px 4px 20px;
        }
        .chat-bubble-ai {
            background: #ffffff;
            border: 1px solid #e9ecef;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-radius: 20px 20px 20px 4px;
        }
        .floating-input-bar {
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            border-radius: 35px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 max-w-xl mx-auto">

    <!-- Top Minimal Navigation -->
    <header class="flex justify-between items-center py-2 border-b border-gray-200 bg-white/80 backdrop-blur sticky top-0 z-10 px-2 rounded-2xl">
        <div class="flex items-center space-x-3">
            <a href="index.html" class="w-9 h-9 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-700">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h1 class="text-base font-bold text-gray-800">Zuron Studio AI</h1>
                <p class="text-[10px] text-purple-600 font-medium">● Voice & Video Engine Active</p>
            </div>
        </div>
        <span class="text-xs bg-purple-50 text-purple-700 font-semibold px-3 py-1 rounded-full">Smart AI</span>
    </header>

    <!-- Chat Stream Area -->
    <main id="chat-stream" class="flex-grow my-4 space-y-4 overflow-y-auto pb-28 px-1">
        
        <!-- Welcome Message -->
        <div class="chat-bubble-ai p-4 max-w-[88%] space-y-2">
            <div class="flex items-center space-x-2">
                <div class="w-6 h-6 rounded-full bg-purple-600 text-white text-[10px] flex items-center justify-center font-bold">Z</div>
                <span class="text-xs font-bold text-gray-700">Zuron AI Assistant</span>
            </div>
            <p class="text-xs text-gray-700 leading-relaxed">
                प्रणाम भाई! आप नीचे दिए गए माइक बटन पर क्लिक करके बोलकर भी कमांड दे सकते हैं। मैं आपकी बात सुनकर तुरंत वीडियो और जवाब तैयार कर दूंगा!
            </p>
        </div>

    </main>

    <!-- Floating Input Bar with Voice & Send -->
    <div class="fixed bottom-3 left-0 right-0 px-3 max-w-xl mx-auto">
        <div class="floating-input-bar p-2 flex items-center border border-gray-200 bg-white">
            
            <!-- Voice Input Button (बोलकर टाइप करने के लिए) -->
            <button onclick="startVoiceRecognition()" id="mic-btn" class="w-10 h-10 rounded-full hover:bg-gray-100 flex items-center justify-center text-gray-600 transition">
                <i class="fas fa-microphone text-sm" id="mic-icon"></i>
            </button>
            
            <input type="text" id="user-prompt" placeholder="बोलें या टाइप करें..." class="w-full bg-transparent border-none text-xs md:text-sm px-2 text-gray-800 focus:outline-none">
            
            <button onclick="processUserMessage()" class="w-10 h-10 rounded-full bg-purple-600 text-white hover:bg-purple-700 flex items-center justify-center ml-1 shadow-md transition">
                <i class="fas fa-paper-plane text-xs"></i>
            </button>
        </div>
    </div>

    <script>
        // Speech-to-Text (बोलकर लिखने की सुविधा)
        function startVoiceRecognition() {
            const micIcon = document.getElementById('mic-icon');
            const promptInput = document.getElementById('user-prompt');

            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert("आपका ब्राउज़र वॉइस कमांड सपोर्ट नहीं करता है।");
                return;
            }

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            
            recognition.lang = 'hi-IN'; // हिंदी भाषा सपोर्ट
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            micIcon.classList.remove('fa-microphone');
            micIcon.classList.add('fa-spinner', 'fa-spin', 'text-purple-600');
            promptInput.placeholder = "सुन रहा हूँ, बोलिए...";

            recognition.start();

            recognition.onresult = function(event) {
                const speechToText = event.results[0][0].transcript;
                promptInput.value = speechToText;
                resetMicUI();
                processUserMessage(); // अपने आप मैसेज भेज देगा
            };

            recognition.onerror = function() {
                resetMicUI();
            };

            recognition.onend = function() {
                resetMicUI();
            };
        }

        function resetMicUI() {
            const micIcon = document.getElementById('mic-icon');
            const promptInput = document.getElementById('user-prompt');
            micIcon.classList.remove('fa-spinner', 'fa-spin', 'text-purple-600');
            micIcon.classList.add('fa-microphone');
            promptInput.placeholder = "बोलें या टाइप करें...";
        }

        // Text-to-Speech (AI की आवाज़ में बोलना)
        function speakText(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'hi-IN';
                utterance.rate = 1.0;
                window.speechSynthesis.speak(utterance);
            }
        }

        // Process Message & Generate Video
        function processUserMessage() {
            const promptInput = document.getElementById('user-prompt');
            const userText = promptInput.value.trim();
            const chatStream = document.getElementById('chat-stream');

            if (!userText) return;

            // 1. User Message Render
            let userMsgHtml = `
                <div class="chat-bubble-user p-3.5 max-w-[85%] ml-auto">
                    <p class="text-xs leading-relaxed font-medium">${userText}</p>
                </div>
            `;
            chatStream.insertAdjacentHTML('beforeend', userMsgHtml);
            promptInput.value = "";

            // 2. AI Processing
            const aiMsgId = 'ai-msg-' + Date.now();
            let aiMsgHtml = `
                <div id="${aiMsgId}" class="chat-bubble-ai p-4 max-w-[88%] space-y-3">
                    <div class="flex items-center space-x-2">
                        <div class="w-6 h-6 rounded-full bg-purple-600 text-white text-[10px] flex items-center justify-center font-bold">Z</div>
                        <span class="text-xs font-bold text-gray-700">Zuron AI Assistant</span>
                    </div>
                    <div class="flex items-center space-x-2 text-xs text-purple-700 font-medium">
                        <i class="fas fa-spinner fa-spin"></i>
                        <span>आपकी बात समझ रहा हूँ और वीडियो रेंडर कर रहा हूँ...</span>
                    </div>
                </div>
            `;
            chatStream.insertAdjacentHTML('beforeend', aiMsgHtml);
            chatStream.scrollTop = chatStream.scrollHeight;

            // 3. Response Generation (Simulated Smart AI & Video)
            setTimeout(() => {
                const aiBox = document.getElementById(aiMsgId);
                const aiReplyText = "लीजिए भाई! आपकी बात के आधार पर 9:16 प्रोमोशनल वीडियो तैयार कर दिया है।";
                
                aiBox.innerHTML = `
                    <div class="flex items-center space-x-2 mb-2">
                        <div class="w-6 h-6 rounded-full bg-purple-600 text-white text-[10px] flex items-center justify-center font-bold">Z</div>
                        <span class="text-xs font-bold text-gray-700">Zuron AI Assistant</span>
                    </div>
                    <p class="text-xs text-gray-700 mb-2">${aiReplyText}</p>
                    
                    <div class="rounded-xl overflow-hidden bg-black border border-gray-200 shadow">
                        <video controls class="w-full h-64 object-cover">
                            <source src="https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-pharmacy-store-42938-large.mp4" type="video/mp4">
                            आपका ब्राउज़र वीडियो सपोर्ट नहीं करता।
                        </video>
                    </div>

                    <a href="https://assets.mixkit.co/videos/preview/mixkit-vertical-shot-of-a-pharmacy-store-42938-large.mp4" download class="mt-2 bg-purple-600 text-white text-xs py-2 px-4 rounded-xl flex items-center justify-center space-x-2 font-medium hover:bg-purple-700 transition">
                        <i class="fas fa-download"></i>
                        <span>HD 9:16 वीडियो डाउनलोड करें</span>
                    </a>
                `;
                chatStream.scrollTop = chatStream.scrollHeight;
                
                // AI बोलकर भी सुनाएगा
                speakText(aiReplyText);
            }, 2500);
        }
    </script>
</body>
</html>
